version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: shawarma-postgres
    environment:
      POSTGRES_DB: shawarma_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: shawarma123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/models/schema.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - shawarma-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: shawarma-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: shawarma123
      DB_NAME: shawarma_db
      JWT_SECRET: ${JWT_SECRET:-super_secret_key_change_me}
      FRONTEND_URL: http://localhost
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shawarma-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: shawarma-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - shawarma-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  shawarma-network:
    driver: bridge
