# Nginx sur le VPS OVH (pas dans Docker)
# Copier : sudo cp deploy/nginx-ovh.conf /etc/nginx/sites-available/danni-shawarma
# Activer : sudo ln -sf /etc/nginx/sites-available/danni-shawarma /etc/nginx/sites-enabled/
# Tester   : sudo nginx -t && sudo systemctl reload nginx
#
# Remplacer votredomaine.com par votre DOMAIN du fichier .env

server {
    listen 80;
    listen [::]:80;
    server_name votredomaine.com www.votredomaine.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
